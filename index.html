<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dceaff">
  <meta name="description" content="个人主页：项目实践、实习经历与科研探索。">
  <title>个人主页</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script defer src="./content.js?v=2"></script>
  <script defer src="./script.js?v=2"></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></symbol>
    <symbol id="icon-project" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18m-12 4-2 2 2 2m6-4 2 2-2 2"/></symbol>
    <symbol id="icon-work" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V4h8v3M3 12c5 4 13 4 18 0m-9 1v4"/></symbol>
    <symbol id="icon-research" viewBox="0 0 24 24"><path d="M9 3h6m-5 0v7L4 19a1.3 1.3 0 0 0 1 2h14a1.3 1.3 0 0 0 1-2l-6-9V3M7 15h10"/><path d="M10 18h.01M14 17h.01"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-github" viewBox="0 0 24 24"><path d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1-.2-1.7-1-2 3-.3 6-1.5 6-6a5 5 0 0 0-1.3-3.5A5 5 0 0 0 18.6 3S17.4 2.7 15 4a13 13 0 0 0-6 0C6.6 2.7 5.4 3 5.4 3a5 5 0 0 0-.1 3.5A5 5 0 0 0 4 10c0 4.5 3 5.7 6 6-.8.3-1 1-1 2v4"/></symbol>
  </svg>

  <div class="site-shell" id="home">
    <header class="topbar">
      <a class="brand" href="#home"><span class="brand-dot"></span><span data-site-name>个人主页</span></a>
      <span class="topbar-note">项目 · 实习 · 科研</span>
    </header>
    <main>
      <section class="hero glass" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">PERSONAL PORTFOLIO</p>
          <h1 id="hero-title">个人主页</h1>
          <p id="site-description" class="hero-description"></p>
          <div class="hero-actions">
            <a class="primary-link" href="#projects">浏览我的经历 <svg aria-hidden="true"><use href="#icon-arrow"/></svg></a>
            <a class="text-link" href="#about">关于我</a>
          </div>
        </div>
        <div class="profile-art" aria-hidden="true">
          <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          <div class="profile-tile"><span class="profile-monogram" id="profile-monogram">NJ</span><span class="profile-handle" id="profile-handle">NJUDJ</span><span class="profile-caption">LEARN · BUILD · EXPLORE</span></div>
          <span class="floating-icon project-orbit"><svg><use href="#icon-project"/></svg></span>
          <span class="floating-icon research-orbit"><svg><use href="#icon-research"/></svg></span>
        </div>
      </section>

      <section id="search-panel" class="search-panel glass" aria-labelledby="search-title" hidden>
        <div class="search-heading"><div><p class="eyebrow">EXPLORE MY EXPERIENCE</p><h2 id="search-title">搜索经历</h2></div><button id="close-search" class="icon-button" type="button" aria-label="关闭搜索"><svg><use href="#icon-close"/></svg></button></div>
        <label class="sr-only" for="search-input">搜索项目、实习或科研</label>
        <div class="input-wrap"><svg aria-hidden="true"><use href="#icon-search"/></svg><input id="search-input" type="search" placeholder="搜索项目、实习、科研或关键词…" autocomplete="off"></div>
        <div id="search-filters" class="search-filters" aria-label="选择经历类型"></div>
        <p id="search-status" class="search-status" role="status"></p>
      </section>

      <div id="resume-sections"></div>
      <p id="empty-message" class="empty-message glass" hidden>没有找到相关经历，换一个关键词试试。</p>

      <section class="about-card glass" id="about" aria-labelledby="about-title">
        <div class="avatar" id="about-initials" aria-hidden="true">NJ</div>
        <div class="about-copy"><p class="eyebrow">ABOUT ME</p><h2 id="about-title">关于我</h2><p id="about-text"></p></div>
        <a id="about-github" class="text-link" href="https://github.com/NJUDJ" target="_blank" rel="noopener noreferrer">GitHub <svg aria-hidden="true"><use href="#icon-arrow"/></svg></a>
      </section>
      <footer class="site-footer">
        <p class="footer-motto">在实践中积累，在探索中成长。</p>
        <p id="uptime" class="uptime" aria-label="网站运行时间"></p>
        <div class="footer-bottom"><span>© <span id="copyright-year"></span> <span data-site-name>个人主页</span></span><button id="theme-toggle" type="button"><span class="theme-dot"></span><span id="theme-label">切换深蓝</span></button></div>
        <p class="tech-line">HTML · CSS · JavaScript · GitHub Pages</p>
      </footer>
    </main>
  </div>

  <nav class="dock" aria-label="主导航">
    <div class="dock-links glass">
      <a href="#home" data-nav="home" aria-label="首页"><svg><use href="#icon-home"/></svg><span>首页</span></a>
      <a href="#projects" data-nav="projects" aria-label="项目"><svg><use href="#icon-project"/></svg><span>项目</span></a>
      <a href="#internships" data-nav="internships" aria-label="实习"><svg><use href="#icon-work"/></svg><span>实习</span></a>
      <a href="#research" data-nav="research" aria-label="科研"><svg><use href="#icon-research"/></svg><span>科研</span></a>
      <a href="#search" data-nav="search" aria-label="搜索"><svg><use href="#icon-search"/></svg><span>搜索</span></a>
    </div>
    <a id="github-link" class="github-link glass" href="https://github.com/NJUDJ" target="_blank" rel="noopener noreferrer" aria-label="访问我的 GitHub"><svg><use href="#icon-github"/></svg></a>
  </nav>

  <dialog id="entry-dialog" class="entry-dialog glass" aria-labelledby="entry-title">
    <button id="close-entry" class="icon-button close-entry" type="button" aria-label="关闭详情"><svg><use href="#icon-close"/></svg></button>
    <p id="entry-meta" class="eyebrow"></p><h2 id="entry-title"></h2><p id="entry-summary" class="entry-summary"></p><div id="entry-body" class="entry-body"></div>
    <a id="entry-link" class="primary-link" target="_blank" rel="noopener noreferrer" hidden>访问相关链接 <svg aria-hidden="true"><use href="#icon-arrow"/></svg></a>
  </dialog>
</body>
</html>
