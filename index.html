<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ecd0b6">
  <meta name="description" content="一间记录学习、写作与日常的小小茶室。">
  <title>小小茶室</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./content.js"></script>
  <script defer src="./script.js"></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5v16M12 5C9 3 5 3 3 4v15c3-1 6-1 9 2 3-3 6-3 9-2V4c-2-1-6-1-9 1Z"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="icon-mark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-github" viewBox="0 0 24 24"><path d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1-.2-1.7-1-2 3-.3 6-1.5 6-6a5 5 0 0 0-1.3-3.5A5 5 0 0 0 18.6 3S17.4 2.7 15 4a13 13 0 0 0-6 0C6.6 2.7 5.4 3 5.4 3a5 5 0 0 0-.1 3.5A5 5 0 0 0 4 10c0 4.5 3 5.7 6 6-.8.3-1 1-1 2v4"/></symbol>
  </svg>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="#home"><span class="brand-dot"></span><span data-site-name>小小茶室</span></a>
      <span class="topbar-note">记录 · 分享 · 慢慢生长</span>
    </header>
    <main>
      <section class="hero glass" aria-labelledby="hero-title">
        <div class="hero-text">
          <p class="eyebrow">MY LITTLE CORNER</p>
          <h1 id="hero-title">小小茶室</h1>
          <p id="site-description" class="hero-description"></p>
          <a class="text-link" href="#articles">坐下来，读一篇文章 <svg><use href="#icon-arrow"/></svg></a>
        </div>
        <div class="tea-art" aria-hidden="true">
          <svg viewBox="0 0 240 230" xmlns="http://www.w3.org/2000/svg">
            <circle cx="122" cy="112" r="87" fill="#faf0df" opacity=".5"/>
            <path d="M85 83c-18-22 24-26 7-48M118 76c-18-22 24-26 7-48M151 83c-18-22 24-26 7-48" fill="none" stroke="#977b64" stroke-width="3" stroke-linecap="round" opacity=".55"/>
            <ellipse cx="119" cy="187" rx="80" ry="13" fill="#b0987b" opacity=".2"/>
            <path d="M170 111h14c32 0 31 42 0 42h-16" fill="none" stroke="#b68d6b" stroke-width="10"/>
            <path d="M60 104h116v42c0 24-22 38-58 38s-58-14-58-38Z" fill="#fff8ed" stroke="#b68d6b" stroke-width="3"/>
            <ellipse cx="118" cy="104" rx="58" ry="12" fill="#f0d6b5" stroke="#b68d6b" stroke-width="3"/>
            <ellipse cx="118" cy="105" rx="48" ry="7" fill="#b29a76"/>
            <path d="M105 135c13-15 27-8 25 4-14 9-26 6-25-4Z" fill="#8b9875"/>
            <path d="m111 145 14-10" stroke="#677551" stroke-width="2"/>
            <path d="M43 189h150" stroke="#b68d6b" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </section>
      <section class="content-section" aria-labelledby="view-title">
        <div class="section-heading"><div><p class="eyebrow" id="view-eyebrow">SLOW NOTES</p><h2 id="view-title">最近写下的</h2></div><span id="item-count" class="count"></span></div>
        <div id="search-panel" class="search-panel glass" hidden><label for="search-input">找一篇想读的文章</label><div class="input-wrap"><svg><use href="#icon-search"/></svg><input id="search-input" type="search" placeholder="输入标题、标签或内容…" autocomplete="off"></div></div>
        <div id="filters" class="filters" aria-label="按标签筛选"></div>
        <div id="cards" class="cards"></div>
        <p id="empty-message" class="empty-message glass" hidden></p>
        <details id="friend-help" class="glass friend-help" hidden><summary>如何添加友链？</summary><p>打开网站文件里的 content.js，在 friends 列表中添加网站名称、简介和链接，再上传更新就可以了。</p></details>
      </section>
      <section class="about-card glass"><div class="avatar" aria-hidden="true">茶</div><div><h2>关于这间茶室</h2><p id="about-text"></p></div></section>
      <footer class="site-footer">
        <p class="footer-label">一页一页，留下自己的痕迹。</p>
        <p class="uptime" id="uptime" aria-label="网站运行时间"></p>
        <p>© <span id="copyright-year"></span> <span data-site-name>小小茶室</span><span class="footer-divider">·</span>Ver 1.0</p>
        <button id="palette-toggle" class="palette-toggle" type="button"><span class="swatch"></span>换一种茶色</button>
        <p class="tech-line">HTML · CSS · JavaScript · GitHub Pages 静态托管</p>
      </footer>
    </main>
  </div>
  <nav class="dock" aria-label="主导航">
    <div class="dock-links glass">
      <a href="#home" data-view="home" aria-label="首页"><svg><use href="#icon-home"/></svg><span>首页</span></a>
      <a href="#articles" data-view="articles" aria-label="文章"><svg><use href="#icon-book"/></svg><span>文章</span></a>
      <a href="#friends" data-view="friends" aria-label="友链"><svg><use href="#icon-pin"/></svg><span>友链</span></a>
      <a href="#bookmarks" data-view="bookmarks" aria-label="收藏"><svg><use href="#icon-mark"/></svg><span>收藏</span></a>
      <a href="#search" data-view="search" aria-label="搜索"><svg><use href="#icon-search"/></svg><span>搜索</span></a>
    </div>
    <a id="github-link" class="github-link glass" href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="访问 GitHub"><svg><use href="#icon-github"/></svg></a>
  </nav>
  <dialog id="article-dialog" class="article-dialog glass" aria-labelledby="article-title">
    <button id="close-article" class="close-button" type="button" aria-label="关闭文章"><svg><use href="#icon-close"/></svg></button>
    <p class="eyebrow" id="article-meta"></p><h2 id="article-title"></h2><div id="article-body" class="article-body"></div>
    <button id="bookmark-button" class="bookmark-button" type="button"></button>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
