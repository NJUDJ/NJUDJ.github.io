<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf3f9">
  <meta name="description" content="个人主页：项目、实习、科研与创业经历。">
  <title>个人主页</title>
  <link rel="stylesheet" href="./style.css?v=4">
  <script defer src="./content.js?v=6"></script>
  <script defer src="./script.js?v=4"></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></symbol>
    <symbol id="icon-project" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18m-12 4-2 2 2 2m6-4 2 2-2 2"/></symbol>
    <symbol id="icon-work" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V4h8v3M3 12c5 4 13 4 18 0m-9 1v4"/></symbol>
    <symbol id="icon-research" viewBox="0 0 24 24"><path d="M9 3h6m-5 0v7L4 19a1.3 1.3 0 0 0 1 2h14a1.3 1.3 0 0 0 1-2l-6-9V3M7 15h10"/><path d="M10 18h.01M14 17h.01"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-github" viewBox="0 0 24 24"><path d="M9 19c-4 1-4-2-6-2m12 5v-4c0-1-.2-1.7-1-2 3-.3 6-1.5 6-6a5 5 0 0 0-1.3-3.5A5 5 0 0 0 18.6 3S17.4 2.7 15 4a13 13 0 0 0-6 0C6.6 2.7 5.4 3 5.4 3a5 5 0 0 0-.1 3.5A5 5 0 0 0 4 10c0 4.5 3 5.7 6 6-.8.3-1 1-1 2v4"/></symbol>
  </svg>

  <div class="site-shell" id="home">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="返回首页"><span id="profile-handle">NJUDJ</span><span class="brand-slash" aria-hidden="true">/</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#home" data-nav="home">首页</a>
        <a href="#projects" data-nav="projects">项目</a>
        <a href="#internships" data-nav="internships">实习</a>
        <a href="#research" data-nav="research">科研</a>
        <a href="#startup" data-nav="startup">创业</a>
        <a href="#search" data-nav="search">搜索</a>
      </nav>
    </header>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <p class="hero-kicker">你好，欢迎来访。</p>
        <h1 id="hero-title">个人主页</h1>
        <p id="site-description" class="hero-description"></p>
        <div class="hero-actions">
          <a class="text-link" href="#about">关于我</a>
          <a id="github-link" class="text-link" href="https://github.com/NJUDJ" target="_blank" rel="noopener noreferrer" aria-label="访问我的 GitHub">GitHub <span aria-hidden="true">↗</span></a>
        </div>
      </section>

      <section id="search-panel" class="search-panel" aria-labelledby="search-title">
        <div class="search-heading"><h2 id="search-title">站内搜索</h2><button id="reset-search" class="reset-search" type="button">清空筛选</button></div>
        <label class="sr-only" for="search-input">搜索项目、实习、科研或创业经历</label>
        <div class="input-wrap"><svg aria-hidden="true"><use href="#icon-search"/></svg><input id="search-input" type="search" placeholder="输入关键词" autocomplete="off"></div>
        <div id="search-filters" class="search-filters" aria-label="选择经历类型"></div>
        <p id="search-status" class="search-status" role="status"></p>
      </section>
      <div id="resume-sections"></div>
      <p id="empty-message" class="empty-message" hidden>没有找到相关内容，换个关键词试试。</p>

      <section class="about-card" id="about" aria-labelledby="about-title">
        <div class="about-heading"><h2 id="about-title">关于我</h2></div>
        <div class="about-copy"><p id="about-text"></p><a id="about-github" class="text-link" href="https://github.com/NJUDJ" target="_blank" rel="noopener noreferrer">在 GitHub 找到我 <span aria-hidden="true">↗</span></a></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-main"><span>© <span id="copyright-year"></span> <span data-site-name>个人主页</span></span><button id="theme-toggle" type="button"><span class="theme-dot" aria-hidden="true"></span><span id="theme-label">切换深蓝</span></button></div>
      <div class="footer-note"><span id="uptime"></span><span>GitHub Pages</span></div>
    </footer>
  </div>
  <dialog id="entry-dialog" class="entry-dialog" aria-labelledby="entry-title">
    <button id="close-entry" class="icon-button close-entry" type="button" aria-label="关闭详情"><svg><use href="#icon-close"/></svg></button>
    <p id="entry-meta" class="eyebrow"></p><h2 id="entry-title"></h2><p id="entry-summary" class="entry-summary"></p><div id="entry-body" class="entry-body"></div>
    <a id="entry-link" class="text-link" target="_blank" rel="noopener noreferrer" hidden>查看相关资料 <svg aria-hidden="true"><use href="#icon-arrow"/></svg></a>
  </dialog>
</body>
</html>
